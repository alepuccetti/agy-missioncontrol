name: Security & Dependency Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  python-dependency-audit:
    name: Python Dependency Audit (pip-audit)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up uv Toolchain
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.15"

      - name: Audit Locked Python Dependencies
        run: |
          uv export --frozen --no-emit-project -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --disable-pip --no-deps
          rm -f requirements-audit.txt

  frontend-dependency-audit:
    name: Frontend Dependency Audit (pnpm audit)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install pnpm Package Manager
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Set up Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Audit Frontend Dependencies
        run: pnpm --prefix src/agymissioncontrol/ui/frontend audit --audit-level=moderate
