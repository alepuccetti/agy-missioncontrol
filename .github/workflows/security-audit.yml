name: Security & Dependency Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  python-dependency-audit:
    name: Python Dependency Audit (pip-audit)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv Toolchain
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          python-version: "3.15"

      - name: Audit Locked Python Dependencies
        run: |
          uv export --frozen --no-emit-project -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --disable-pip --no-deps
          rm -f requirements-audit.txt

  frontend-dependency-audit:
    name: Frontend Dependency Audit (pnpm audit)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm Package Manager
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12

      - name: Set up Node.js LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26

      - name: Audit Frontend Dependencies
        run: pnpm --prefix src/agymissioncontrol/ui/frontend audit --audit-level=moderate

  secrets-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  signed-commits:
    name: Verify Commit Signatures
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check GPG signature headers on commits
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            RANGE="-n 1 ${{ github.sha }}"
          fi

          for sha in $(git rev-list $RANGE); do
            short_sha="$(git rev-parse --short "$sha")"
            subject="$(git log -1 --format="%s" "$sha")"
            if ! git cat-file commit "$sha" | grep -q '^gpgsig '; then
              echo "✗ Unsigned commit detected: $short_sha ($subject)" >&2
              exit 1
            fi
            echo "✓ Signed commit: $short_sha ($subject)"
          done
