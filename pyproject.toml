[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agymissioncontrol"
version = "0.1.0"
description = "Autonomous task orchestrator, quota governor, and issue-to-spec compiler for Google Antigravity"
readme = "README.md"
requires-python = ">=3.15"
license = "MIT"
authors = [{ name = "Orion" }]
dependencies = [
    "typer>=0.29.0",
    "pydantic>=2.14.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.0",
    "pyinstaller>=6.22.0",
]

[project.scripts]
agymissioncontrol = "agymissioncontrol.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agymissioncontrol"]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
